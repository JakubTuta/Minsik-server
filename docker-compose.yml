        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - minsik-network
    restart: unless-stopped

# ============================================================================
# Volumes - Development (named volumes for easy cleanup)
# ============================================================================
volumes:
  postgres_data_dev:
    driver: local
  redis_data_dev:
    driver: local
  es_data_dev:
    driver: local

# ============================================================================
# Networks - Development
# ============================================================================
networks:
  minsik-network:
    driver: bridge
    name: minsik-dev-network
