        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: sh -c "sh /app/scripts/dev-compile-protos.sh books && exec watchfiles 'python -m app.main' /app/app"
    environment:
      ENV: ${ENV}
      DEBUG: ${DEBUG}
      LOG_LEVEL: ${LOG_LEVEL}
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AVAILABLE_LANGUAGES: ${AVAILABLE_LANGUAGES}
      LEDGER_API_KEY: ${LEDGER_API_KEY}
    ports:
      # EXPOSED for local access (gRPC debugging)
      - "50055:50055"
    volumes:
      - ./services/books/app:/app/app
      - ./services/books/tests:/app/tests
      - ./proto:/app/proto_src:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - minsik-network
    restart: unless-stopped

  # ============================================================================
  # Auth Service - Development Configuration
  # ============================================================================
  auth-service:
