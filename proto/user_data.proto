syntax = "proto3";
package user_data.v1;

service UserDataService {
  rpc GetBookshelf(GetBookshelfRequest) returns (BookshelfResponse);
  rpc UpsertBookshelf(UpsertBookshelfRequest) returns (BookshelfResponse);
  rpc DeleteBookshelf(DeleteBookshelfRequest) returns (EmptyResponse);
  rpc GetUserBookshelves(GetUserBookshelvesRequest) returns (BookshelvesListResponse);
  rpc GetPublicBookshelves(GetPublicBookshelvesRequest) returns (BookshelvesListResponse);

  rpc GetRating(GetRatingRequest) returns (RatingResponse);
  rpc UpsertRating(UpsertRatingRequest) returns (RatingResponse);
  rpc DeleteRating(DeleteRatingRequest) returns (EmptyResponse);
  rpc GetUserRatings(GetUserRatingsRequest) returns (RatingsListResponse);

  rpc ToggleFavourite(ToggleFavouriteRequest) returns (FavouriteResponse);
  rpc GetUserFavourites(GetUserFavouritesRequest) returns (BookshelvesListResponse);

  rpc CreateComment(CreateCommentRequest) returns (CommentResponse);
  rpc UpdateComment(UpdateCommentRequest) returns (CommentResponse);
  rpc DeleteComment(DeleteCommentRequest) returns (EmptyResponse);
  rpc GetUserComments(GetUserCommentsRequest) returns (CommentsListResponse);
  rpc GetBookComments(GetBookCommentsRequest) returns (BookCommentsResponse);
  rpc GetUserBookInfo(GetUserBookInfoRequest) returns (UserBookInfoResponse);
  rpc GetPublicProfileStats(GetPublicProfileStatsRequest) returns (ProfileStatsResponse);
  rpc GetProfileOverview(GetProfileOverviewRequest) returns (ProfileOverviewResponse);
  rpc GetYearInReview(GetYearInReviewRequest) returns (YearInReviewResponse);
  rpc DeleteUserData(DeleteUserDataRequest) returns (EmptyResponse);
}

// Bookshelf
message GetBookshelfRequest    { int64 user_id = 1; string book_slug = 2; }
message UpsertBookshelfRequest { int64 user_id = 1; string book_slug = 2; string status = 3; }
message DeleteBookshelfRequest { int64 user_id = 1; string book_slug = 2; }
message GetUserBookshelvesRequest {
  int64 user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
  string status_filter = 4;
  bool favourites_only = 5;
  string sort_by = 6;
  string order = 7;
}
message GetPublicBookshelvesRequest {
  string username        = 1;
  int32  limit           = 2;
  int32  offset          = 3;
  string status_filter   = 4;
  bool   favourites_only = 5;
  string sort_by         = 6;
  string order           = 7;
}
message Bookshelf {
  int64 bookshelf_id = 1;
  int64 user_id = 2;
  int64 book_id = 3;
  string book_slug = 4;
  string book_title = 5;
  string book_cover_url = 6;
  string status = 7;
  bool is_favorite = 8;
  string created_at = 9;
  string updated_at = 10;
  repeated string book_author_names = 11;
  repeated string book_author_slugs = 12;
  string book_series_name = 13;
  string book_series_slug = 14;
}
message BookshelfResponse       { Bookshelf bookshelf = 1; }
message BookshelvesListResponse { repeated Bookshelf bookshelves = 1; int32 total_count = 2; }

// Ratings
message GetRatingRequest    { int64 user_id = 1; string book_slug = 2; }
message UpsertRatingRequest {
  int64 user_id = 1;
  string book_slug = 2;
  float overall_rating = 3;
  string review_text = 4;
  float pacing = 5;
  bool has_pacing = 6;
  float emotional_impact = 7;
  bool has_emotional_impact = 8;
  float intellectual_depth = 9;
  bool has_intellectual_depth = 10;
  float writing_quality = 11;
  bool has_writing_quality = 12;
  float rereadability = 13;
  bool has_rereadability = 14;
  float readability = 15;
  bool has_readability = 16;
  float plot_complexity = 17;
  bool has_plot_complexity = 18;
  float humor = 19;
  bool has_humor = 20;
}
message DeleteRatingRequest  { int64 user_id = 1; string book_slug = 2; }
message GetUserRatingsRequest {
  int64 user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
  string sort_by = 4;
  string order = 5;
  float min_rating = 6;
  float max_rating = 7;
}
message Rating {
  int64 rating_id = 1;
  int64 user_id = 2;
  int64 book_id = 3;
  string book_slug = 4;
  string book_title = 5;
  string book_cover_url = 6;
  float overall_rating = 7;
  string review_text = 8;
  float pacing = 9;
  bool has_pacing = 10;
  float emotional_impact = 11;
  bool has_emotional_impact = 12;
  float intellectual_depth = 13;
  bool has_intellectual_depth = 14;
  float writing_quality = 15;
  bool has_writing_quality = 16;
  float rereadability = 17;
  bool has_rereadability = 18;
  float readability = 21;
  bool has_readability = 22;
  float plot_complexity = 23;
  bool has_plot_complexity = 24;
  float humor = 25;
  bool has_humor = 26;
  string created_at = 19;
  string updated_at = 20;
  repeated string book_author_names = 27;
  repeated string book_author_slugs = 28;
  string book_series_name = 29;
  string book_series_slug = 30;
  double book_avg_rating = 31;
  int32 book_rating_count = 32;
}
message RatingResponse      { Rating rating = 1; }
message RatingsListResponse { repeated Rating ratings = 1; int32 total_count = 2; }

// Favourites
message ToggleFavouriteRequest   { int64 user_id = 1; string book_slug = 2; bool is_favorite = 3; }
message FavouriteResponse        { bool is_favorite = 1; int64 book_id = 2; string book_slug = 3; }
message GetUserFavouritesRequest { int64 user_id = 1; int32 limit = 2; int32 offset = 3; }

// Comments
message CreateCommentRequest { int64 user_id = 1; string book_slug = 2; string body = 3; bool is_spoiler = 4; }
message UpdateCommentRequest { int64 comment_id = 1; int64 user_id = 2; string body = 3; bool is_spoiler = 4; }
message DeleteCommentRequest { int64 comment_id = 1; int64 user_id = 2; }
message GetUserCommentsRequest {
  int64 user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
  string sort_by = 4;
  string order = 5;
  string book_slug = 6;
}
message Comment {
  int64 comment_id = 1;
  int64 user_id = 2;
  int64 book_id = 3;
  string book_slug = 4;
  string body = 5;
  bool is_spoiler = 6;
  string created_at = 7;
  string updated_at = 8;
  string username = 9;
  repeated string book_author_names = 10;
  repeated string book_author_slugs = 11;
  string book_series_name = 12;
  string book_series_slug = 13;
  string book_cover_url = 14;
  string book_title = 15;
}
message CommentResponse      { Comment comment = 1; }
message CommentsListResponse { repeated Comment comments = 1; int32 total_count = 2; }

message EmptyResponse {}

message GetBookCommentsRequest {
  string book_slug          = 1;
  int32  limit              = 2;
  int32  offset             = 3;
  string order              = 4;
  bool   include_spoilers   = 5;
  string sort_by            = 6;
  int64  requesting_user_id = 7;
  repeated float rating_filters = 8;
}

message BookCommentWithRating {
  int64  comment_id             = 1;
  int64  user_id                = 2;
  int64  book_id                = 3;
  string book_slug              = 4;
  string body                   = 5;
  bool   is_spoiler             = 6;
  string comment_created_at     = 7;
  string comment_updated_at     = 8;
  bool   has_rating             = 9;
  float  overall_rating         = 10;
  string review_text            = 11;
  float  pacing                 = 12;
  bool   has_pacing             = 13;
  float  emotional_impact       = 14;
  bool   has_emotional_impact   = 15;
  float  intellectual_depth     = 16;
  bool   has_intellectual_depth = 17;
  float  writing_quality        = 18;
  bool   has_writing_quality    = 19;
  float  rereadability          = 20;
  bool   has_rereadability      = 21;
  float  readability            = 22;
  bool   has_readability        = 23;
  float  plot_complexity        = 24;
  bool   has_plot_complexity    = 25;
  float  humor                  = 26;
  bool   has_humor              = 27;
  string username               = 28;
}

message BookCommentsResponse {
  repeated BookCommentWithRating comments    = 1;
  int32                          total_count = 2;
  BookCommentWithRating          my_entry    = 3;
}

// User Book Info (consolidated)
message GetUserBookInfoRequest { int64 user_id = 1; string book_slug = 2; }
message UserBookInfoResponse {
  Bookshelf bookshelf = 1;
  Rating    rating    = 2;
  Comment   comment   = 3;
}

// Profile stats (public)
message GetPublicProfileStatsRequest { string username = 1; }
message ProfileStats {
  int32 want_to_read_count           = 1;
  int32 reading_count                = 2;
  int32 read_count                   = 3;
  int32 abandoned_count              = 4;
  int32 favourites_count             = 5;
  int32 ratings_count                = 6;
  int32 comments_count               = 7;
  int32 finished_this_year_count     = 8;
  int32 pages_read_this_year         = 9;
  int32 hours_read_this_year         = 10;
  string bookshelf_updated_at        = 11;
  string favourites_updated_at       = 12;
  string comments_updated_at         = 13;
  string ratings_updated_at          = 14;
  double average_rating              = 15;
  string rating_distribution_json    = 16;
  int32 pages_read_total             = 17;
  int32 reviews_count                = 18;
}
message ProfileStatsResponse { ProfileStats stats = 1; }

// Profile overview (combined public profile widget data)
message GetProfileOverviewRequest { string username = 1; }
message PublicUser {
  int64 user_id       = 1;
  string username     = 2;
  string display_name = 3;
  string avatar_url   = 4;
  string bio          = 5;
}
message OverviewBook {
  string book_slug              = 1;
  string book_title             = 2;
  string book_cover_url         = 3;
  repeated string book_author_names = 4;
  repeated string book_author_slugs = 5;
}
message TopGenre {
  string name    = 1;
  string slug    = 2;
  int32  count   = 3;
  double percent = 4;
}
message FavouriteAuthor {
  string name      = 1;
  string slug      = 2;
  int32  count     = 3;
  string photo_url = 4;
}
message ProfileOverviewResponse {
  PublicUser              user                  = 1;
  OverviewBook            reading_now           = 2;
  repeated TopGenre       top_genres            = 3;
  repeated FavouriteAuthor favourite_authors    = 4;
  repeated OverviewBook   favourites_this_year  = 5;
  bool                    reading_now_present   = 6;
}

// Year in review
message GetYearInReviewRequest { int64 user_id = 1; int32 year = 2; }
message MonthlyBucket {
  int32 month          = 1;
  int32 books_finished = 2;
  int32 pages_read     = 3;
  int32 ratings_given  = 4;
}
message YearBook {
  string book_slug          = 1;
  string book_title         = 2;
  string book_cover_url     = 3;
  repeated string author_names = 4;
  repeated string author_slugs = 5;
  int32  number_of_pages    = 6;
  string finished_at        = 7;
  float  my_rating          = 8;
  bool   has_my_rating      = 9;
}
message YearInReview {
  int32 year                          = 1;
  int32 months_elapsed                = 2;
  repeated MonthlyBucket monthly      = 3;
  int32 total_books_finished          = 4;
  int32 total_pages_read              = 5;
  int32 total_hours_read              = 6;
  int32 ratings_given                 = 7;
  int32 reviews_written               = 8;
  int32 comments_written              = 9;
  int32 favourites_added              = 10;
  double average_rating_given         = 11;
  string rating_distribution_json     = 12;
  repeated TopGenre top_genres        = 13;
  repeated FavouriteAuthor top_authors = 14;
  YearBook longest_book               = 15;
  bool has_longest_book               = 16;
  YearBook shortest_book              = 17;
  bool has_shortest_book              = 18;
  YearBook first_finished             = 19;
  bool has_first_finished             = 20;
  YearBook highest_rated              = 21;
  bool has_highest_rated              = 22;
  double average_pages_per_book       = 23;
  int32 busiest_month                 = 24;
  int32 busiest_month_count           = 25;
  double average_days_to_finish       = 26;
  int32 currently_reading_count       = 27;
  int32 added_to_shelf_count          = 28;
  repeated string finished_cover_urls = 29;
}
message YearInReviewResponse { YearInReview review = 1; }

// Account deletion
message DeleteUserDataRequest { int64 user_id = 1; }
