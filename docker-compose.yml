services:
  # ============================================================================
  # PostgreSQL - Development Configuration
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: minsik-postgres-dev
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      # EXPOSED for local access (DB clients, debugging)
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - minsik-network
    restart: unless-stopped

  # ============================================================================
  # Redis - Development Configuration
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: minsik-redis-dev
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    ports:
      # EXPOSED for local access (Redis CLI, debugging)
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - minsik-network
    restart: unless-stopped

  # ============================================================================
  # Elasticsearch - Development Configuration
  # ============================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    container_name: minsik-elasticsearch-dev
    # Analysis plugins install on start, since Elasticsearch has no way to load
    # them at runtime and the stock image ships without them:
    #   analysis-icu     - `icu_folding`, which folds the letters `asciifolding`
    #                      leaves alone (Polish 'l', Turkish dotless i)
    #   analysis-stempel - Polish stemming ("ksiazki" -> "ksiaz")
    # A failed download is not fatal: app/es_client.py detects what the cluster
    # actually has and builds a weaker analysis chain instead of refusing to
    # index. The mapping fingerprint covers the plugin set, so a later start
    # that does get them rebuilds the indexes and swaps the aliases by itself.
    command:
      - bash
      - -c
      - |
        for plugin in analysis-icu analysis-stempel; do
          elasticsearch-plugin list | grep -qx "$$plugin" \
            || elasticsearch-plugin install --batch "$$plugin" \
            || echo "WARN: could not install $$plugin, continuing without it"
        done
        exec /usr/local/bin/docker-entrypoint.sh eswrapper
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      # EXPOSED for local access (Kibana, debugging)
      - "9200:9200"
    volumes:
      - es_data_dev:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:9200/_cluster/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - minsik-network
    restart: unless-stopped

  # ============================================================================
  # DB Migrator - Development (runs all migrations before services start)
  # ============================================================================
  db-migrator:
    build:
      context: .
      dockerfile: services/db_migrator/Dockerfile
    container_name: minsik-db-migrator-dev
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - minsik-network
    restart: "no"

  # ============================================================================
  # Gateway Service - Development Configuration
  # ============================================================================
  gateway-service:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: minsik-gateway-service-dev
    command: sh -c "sh /app/scripts/dev-compile-protos.sh ingestion books auth user_data recommendation && exec uvicorn app.main:app --host 0.0.0.0 --port 8040 --reload --reload-dir /app/app"
    environment:
      ENV: ${ENV}
      DEBUG: ${DEBUG}
      LOG_LEVEL: ${LOG_LEVEL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      COOKIE_SECURE: ${COOKIE_SECURE}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      LEDGER_API_KEY: ${LEDGER_API_KEY}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS}
      AVAILABLE_LANGUAGES: ${AVAILABLE_LANGUAGES}
    ports:
      # EXPOSED for client access
      - "${GATEWAY_HTTP_PORT}:8040"
    volumes:
      - ./services/gateway/app:/app/app
      - ./services/gateway/tests:/app/tests
      - ./proto:/app/proto_src:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      redis:
        condition: service_healthy
      ingestion-service:
        condition: service_healthy
      books-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      user-data-service:
        condition: service_healthy
      recommendation-service:
        condition: service_healthy
    networks:
      - minsik-network
    restart: unless-stopped

  # ============================================================================
  # Ingestion Service - Development Configuration
  # ============================================================================
  ingestion-service:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    container_name: minsik-ingestion-service-dev
    # gRPC services answer grpc.health.v1 rather than an HTTP probe, so the
    # gateway is only started once each backend can actually serve. Without it
    # the gateway reports healthy while its dependencies are still opening
    # database pools, and the first requests after a deploy fail.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import grpc, grpc_health.v1.health_pb2 as p, grpc_health.v1.health_pb2_grpc as g; s = g.HealthStub(grpc.insecure_channel('localhost:50054')).Check(p.HealthCheckRequest(), timeout=3).status; exit(0 if s == p.HealthCheckResponse.SERVING else 1)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    command: sh -c "sh /app/scripts/dev-compile-protos.sh ingestion && exec watchfiles 'python -m app.main' /app/app"
    environment:
      ENV: ${ENV}
      DEBUG: ${DEBUG}
      LOG_LEVEL: ${LOG_LEVEL}
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY}
      LEDGER_API_KEY: ${LEDGER_API_KEY}
    ports:
      # EXPOSED for local access (gRPC debugging)
      - "50054:50054"
    volumes:
      - ./services/ingestion/app:/app/app
      - ./services/ingestion/tests:/app/tests
      - ./proto:/app/proto_src:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - minsik-network
    restart: unless-stopped

  # ============================================================================
  # Books Service - Development Configuration
  # ============================================================================
  books-service:
    build:
      context: .
      dockerfile: services/books/Dockerfile
    container_name: minsik-books-service-dev
    # gRPC services answer grpc.health.v1 rather than an HTTP probe, so the
