syntax = "proto3";

package recommendation.v1;

service RecommendationService {
  rpc GetRecommendationList(GetRecommendationListRequest) returns (RecommendationListResponse);
  rpc GetHomePage(GetHomePageRequest) returns (HomePageResponse);
  rpc GetAvailableCategories(GetAvailableCategoriesRequest) returns (AvailableCategoriesResponse);
  rpc RefreshRecommendations(RefreshRecommendationsRequest) returns (RefreshRecommendationsResponse);
  rpc RefreshBookOfTheWeek(RefreshBookOfTheWeekRequest) returns (RefreshBookOfTheWeekResponse);
  rpc RefreshPersonalRecommendations(RefreshPersonalRecommendationsRequest) returns (RefreshPersonalRecommendationsResponse);
  rpc RefreshUserPersonalRecommendations(RefreshUserPersonalRecommendationsRequest) returns (RefreshUserPersonalRecommendationsResponse);
  rpc RefreshContextualRecommendations(RefreshContextualRecommendationsRequest) returns (RefreshContextualRecommendationsResponse);
  rpc InvalidateContextualCache(InvalidateContextualCacheRequest) returns (InvalidateContextualCacheResponse);
  rpc InvalidateUserRecommendations(InvalidateUserRecommendationsRequest) returns (InvalidateUserRecommendationsResponse);
  rpc GetBookRecommendations(GetBookRecommendationsRequest) returns (BookRecommendationsResponse);
  rpc GetAuthorRecommendations(GetAuthorRecommendationsRequest) returns (AuthorRecommendationsResponse);
  rpc GetSeriesRecommendations(GetSeriesRecommendationsRequest) returns (SeriesRecommendationsResponse);
  rpc GetBookOfTheWeek(GetBookOfTheWeekRequest) returns (BookOfTheWeekResponse);
}

message GetRecommendationListRequest {
  string category = 1;
  int32 limit = 2;
  int32 offset = 3;
  string language = 4;
  int64 user_id = 5;
}

message RecommendationListResponse {
  string category = 1;
  string display_name = 2;
  string item_type = 3;
  repeated RecommendationBookItem book_items = 4;
  repeated RecommendationAuthorItem author_items = 5;
  int32 total = 6;
  // Interpolation values for a section-key-based frontend translation of
  // display_name (e.g. {"title": "Neuromancer"} for "because_you_liked").
  // Empty for sections whose title has no dynamic part.
  map<string, string> title_params = 7;
}

message RecommendationBookItem {
  int64 book_id = 1;
  string title = 2;
  string slug = 3;
  string language = 4;
  string primary_cover_url = 5;
  repeated string author_names = 6;
  repeated string author_slugs = 7;
  string avg_rating = 8;
  int32 rating_count = 9;
  double score = 10;
  int32 readers = 11;
  string work_id = 12;
}

message RecommendationAuthorItem {
  int64 author_id = 1;
  string name = 2;
  string slug = 3;
  string photo_url = 4;
  int32 book_count = 5;
  double score = 6;
  string avg_rating = 7;
  int32 readers = 8;
  int32 rating_count = 9;
}

message GetHomePageRequest {
  int32 items_per_category = 1;
  int64 user_id = 2;
  string language = 3;
}

message HomePageResponse {
  repeated RecommendationListResponse categories = 1;
}

message GetAvailableCategoriesRequest {}

message AvailableCategoriesResponse {
  repeated CategoryInfo categories = 1;
}

message CategoryInfo {
  string category = 1;
  string display_name = 2;
  string item_type = 3;
}

message RefreshRecommendationsRequest {}

message RefreshRecommendationsResponse {
  bool success = 1;
  string message = 2;
}

message RefreshBookOfTheWeekRequest {}

message RefreshBookOfTheWeekResponse {
  bool success = 1;
  string message = 2;
}

message RefreshPersonalRecommendationsRequest {}

message RefreshPersonalRecommendationsResponse {
  bool success = 1;
  string message = 2;
}

message RefreshUserPersonalRecommendationsRequest {
  string username = 1;
}

message RefreshUserPersonalRecommendationsResponse {
  bool success = 1;
  string message = 2;
}

message RefreshContextualRecommendationsRequest {}

message RefreshContextualRecommendationsResponse {
  bool success = 1;
  string message = 2;
}

message InvalidateContextualCacheRequest {
  string entity_type = 1;
  string slug = 2;
}

message InvalidateContextualCacheResponse {
  bool success = 1;
  string message = 2;
}

message InvalidateUserRecommendationsRequest {
  int64 user_id = 1;
}

message InvalidateUserRecommendationsResponse {
  bool success = 1;
  int32 deleted_keys = 2;
}

message GetBookRecommendationsRequest {
  int64 book_id = 1;
  int32 limit_per_section = 2;
  int64 user_id = 3;
}

message GetAuthorRecommendationsRequest {
  int64 author_id = 1;
  int32 limit_per_section = 2;
  int64 user_id = 3;
}

message RecommendationSection {
  string section_key = 1;
  string display_name = 2;
  string item_type = 3;
  repeated RecommendationBookItem book_items = 4;
  repeated RecommendationAuthorItem author_items = 5;
  int32 total = 6;
  // See RecommendationListResponse.title_params.
  map<string, string> title_params = 7;
}

message BookRecommendationsResponse {
  int64 book_id = 1;
  repeated RecommendationSection sections = 2;
}

message AuthorRecommendationsResponse {
  int64 author_id = 1;
  repeated RecommendationSection sections = 2;
}

message GetSeriesRecommendationsRequest {
  int64 series_id = 1;
  int32 limit_per_section = 2;
}

message SeriesRecommendationsResponse {
  int64 series_id = 1;
  repeated RecommendationSection sections = 2;
}

message GetBookOfTheWeekRequest {
  string language = 1;
}

message BookOfTheWeekAuthor {
  int64 author_id = 1;
  string name = 2;
  string slug = 3;
}

message BookOfTheWeekCategory {
  int64 genre_id = 1;
  string name = 2;
  string slug = 3;
}

message BookOfTheWeekResponse {
  int64 book_id = 1;
  string title = 2;
  string slug = 3;
  string language = 4;
  string primary_cover_url = 5;
  string first_sentence = 6;
  double weighted_avg_rating = 7;
  int32 rating_count = 8;
  repeated BookOfTheWeekAuthor authors = 9;
  repeated BookOfTheWeekCategory categories = 10;
}
