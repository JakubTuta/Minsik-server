services:
  # ============================================================================
  # Frontend App - Production Configuration
  # ============================================================================
  frontend:
    image: container-registry.jtuta.cloud/minsik/frontend:latest
    container_name: minsik-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:3000"
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL}
      NUXT_PUBLIC_I18N_BASE_URL: ${NUXT_PUBLIC_SITE_URL}
      NUXT_PUBLIC_GOOGLE_CLIENT_ID: ${NUXT_PUBLIC_GOOGLE_CLIENT_ID}
      # In-cluster gateway address for SSR data fetches — keeps them on the
      # internal network instead of hairpinning out over public TLS to
      # NUXT_PUBLIC_API_BASE and back in. Requires minsik-internal below.
      NUXT_API_BASE_INTERNAL: http://gateway-service:8040
      PORT: 3000
    depends_on:
      gateway-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    networks:
      - minsik-frontend
      - minsik-internal
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ============================================================================
  # ElasticSearch - Production Configuration
  # ============================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    container_name: minsik-elasticsearch
    # Analysis plugins install on start, since Elasticsearch has no way to load
    # them at runtime and the stock image ships without them:
    #   analysis-icu     - `icu_folding`, which folds the letters `asciifolding`
    #                      leaves alone (Polish 'l', Turkish dotless i)
    #   analysis-stempel - Polish stemming ("ksiazki" -> "ksiaz")
    # Needs outbound access to elastic.co on start. A failed download is not
    # fatal: app/es_client.py detects what the cluster actually has and builds a
    # weaker analysis chain instead of refusing to index, and the next start
    # that does get the plugins rebuilds the indexes and swaps the aliases by
    # itself. Watch for "WARN: could not install" in the container logs.
    command:
      - bash
      - -c
      - |
        for plugin in analysis-icu analysis-stempel; do
          elasticsearch-plugin list | grep -qx "$$plugin" \
            || elasticsearch-plugin install --batch "$$plugin" \
            || echo "WARN: could not install $$plugin, continuing without it"
        done
        exec /usr/local/bin/docker-entrypoint.sh eswrapper
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms768m -Xmx768m
    # NO EXPOSED PORTS - internal network only (security)
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:9200/_cluster/health || exit 1",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
        reservations:
          cpus: "0.5"
          memory: 1G
    networks:
      - minsik-internal
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ============================================================================
  # PostgreSQL - Production Configuration
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: minsik-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    # NO EXPOSED PORTS - internal network only (security)
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=64MB
      -c maintenance_work_mem=64MB
      -c effective_cache_size=768MB
      -c wal_buffers=16MB
      -c max_connections=50
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
      -c dynamic_shared_memory_type=posix
    shm_size: "512m"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
        reservations:
          cpus: "0.25"
          memory: 512M
    networks:
      - minsik-internal
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    user: postgres

  # ============================================================================
  # Redis - Production Configuration
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: minsik-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 384mb
      --maxmemory-policy allkeys-lru
      --save 300 10
      --save 900 1
      --appendonly yes
      --appendfsync everysec
      --tcp-backlog 128
      --timeout 300
      --tcp-keepalive 300
      --maxclients 50
    # NO EXPOSED PORTS - internal network only (security)
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    networks:
      - minsik-internal
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    user: redis

  # ============================================================================
  # DB Migrator - Production (runs all migrations before services start)
  # ============================================================================
  db-migrator:
    image: container-registry.jtuta.cloud/minsik/db-migrator:latest
    container_name: minsik-db-migrator
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - minsik-internal
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ============================================================================
  # Gateway Service - Production Configuration
  # ============================================================================
  gateway-service:
    image: container-registry.jtuta.cloud/minsik/gateway-service:latest
    container_name: minsik-gateway-service
    environment:
      ENV: ${ENV}
      DEBUG: ${DEBUG}
      LOG_LEVEL: ${LOG_LEVEL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      COOKIE_SECURE: ${COOKIE_SECURE}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      LEDGER_API_KEY: ${LEDGER_API_KEY}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS}
      AVAILABLE_LANGUAGES: ${AVAILABLE_LANGUAGES}
    ports:
      - "127.0.0.1:${GATEWAY_HTTP_PORT}:8040"
    depends_on:
      redis:
        condition: service_healthy
      ingestion-service:
        condition: service_started
      books-service:
        condition: service_started
      auth-service:
        condition: service_started
      user-data-service:
        condition: service_started
      recommendation-service:
        condition: service_started
    # The frontend gates its own startup on this. Without it, Nuxt can serve —
    # and SWR-cache — a render whose data fetches got ECONNREFUSED, pinning an
    # empty home page for the whole cache lifetime after every deploy.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8040/health', timeout=3)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - minsik-internal
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ============================================================================
  # Ingestion Service - Production Configuration
  # ============================================================================
  ingestion-service:
    image: container-registry.jtuta.cloud/minsik/ingestion-service:latest
    container_name: minsik-ingestion-service
    stop_grace_period: 30s
    environment:
      ENV: ${ENV}
      DEBUG: ${DEBUG}
      LOG_LEVEL: ${LOG_LEVEL}
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY}
      LEDGER_API_KEY: ${LEDGER_API_KEY}
    # NO EXPOSED PORTS - internal network only (security)
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.15"
          memory: 192M
    networks:
      - minsik-internal
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ============================================================================
  # Books Service - Production Configuration
  # ============================================================================
  books-service:
    image: container-registry.jtuta.cloud/minsik/books-service:latest
    container_name: minsik-books-service
    environment:
      ENV: ${ENV}
      DEBUG: ${DEBUG}
      LOG_LEVEL: ${LOG_LEVEL}
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AVAILABLE_LANGUAGES: ${AVAILABLE_LANGUAGES}
      LEDGER_API_KEY: ${LEDGER_API_KEY}
    # NO EXPOSED PORTS - internal network only (security)
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - minsik-internal
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ============================================================================
  # Auth Service - Production Configuration
  # ============================================================================
  auth-service:
    image: container-registry.jtuta.cloud/minsik/auth-service:latest
    container_name: minsik-auth-service
    environment:
      ENV: ${ENV}
      DEBUG: ${DEBUG}
      LOG_LEVEL: ${LOG_LEVEL}
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      LEDGER_API_KEY: ${LEDGER_API_KEY}
    # NO EXPOSED PORTS - internal network only (security)
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M
    networks:
      - minsik-internal
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ============================================================================
  # User Data Service - Production Configuration
  # ============================================================================
  user-data-service:
    image: container-registry.jtuta.cloud/minsik/user-data-service:latest
    container_name: minsik-user-data-service
    environment:
      ENV: ${ENV}
      DEBUG: ${DEBUG}
      LOG_LEVEL: ${LOG_LEVEL}
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      LEDGER_API_KEY: ${LEDGER_API_KEY}
    # NO EXPOSED PORTS - internal network only (security)
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M
    networks:
      - minsik-internal
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ============================================================================
  # Recommendation Service - Production Configuration
  # ============================================================================
  recommendation-service:
    image: container-registry.jtuta.cloud/minsik/recommendation-service:latest
    container_name: minsik-recommendation-service
    environment:
      ENV: ${ENV}
      DEBUG: ${DEBUG}
      LOG_LEVEL: ${LOG_LEVEL}
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AVAILABLE_LANGUAGES: ${AVAILABLE_LANGUAGES}
      LEDGER_API_KEY: ${LEDGER_API_KEY}
    # NO EXPOSED PORTS - internal network only (security)
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M
    networks:
      - minsik-internal
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ============================================================================
  # RQ Worker - Production Configuration
  # ============================================================================
  rq-worker:
    image: container-registry.jtuta.cloud/minsik/rq-worker:latest
    container_name: minsik-rq-worker
    command: rq worker ingestion --url redis://:${REDIS_PASSWORD}@${REDIS_HOST}:6379/0
    environment:
      ENV: ${ENV}
      DEBUG: ${DEBUG}
      LOG_LEVEL: ${LOG_LEVEL}
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY}
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    networks:
      - minsik-internal
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

# ============================================================================
# Volumes - Production (persistent, backed up)
# ============================================================================
volumes:
  postgres_data:
    name: minsik-postgres-data
    driver: local

  redis_data:
    name: minsik-redis-data
    driver: local

  es_data:
    name: minsik-es-data
    driver: local

# ============================================================================
# Networks - Production (isolated internal network)
# ============================================================================
networks:
  minsik-frontend:
    driver: bridge

  minsik-internal:
    driver: bridge
    name: minsik-prod-network
    internal: false
    ipam:
      driver: default
      config:
        - subnet: 172.32.0.0/16
