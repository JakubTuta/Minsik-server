      context: .
      dockerfile: services/ingestion/Dockerfile
    container_name: minsik-rq-worker-dev
    command: sh -c "sh /app/scripts/dev-compile-protos.sh ingestion && exec rq worker ingestion --url redis://:${REDIS_PASSWORD}@${REDIS_HOST}:6379/0"
