services:
  # ============================================================================
  # Frontend App - Production Configuration
  # ============================================================================
  frontend:
    image: container-registry.jtuta.cloud/minsik/frontend:latest
    container_name: minsik-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:3000"
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL}
      NUXT_PUBLIC_GOOGLE_CLIENT_ID: ${NUXT_PUBLIC_GOOGLE_CLIENT_ID}
      PORT: 3000
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 128M
    networks:
      - minsik-frontend
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ============================================================================
  # ElasticSearch - Production Configuration
  # ============================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    container_name: minsik-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms768m -Xmx768m
    # NO EXPOSED PORTS - internal network only (security)
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:9200/_cluster/health || exit 1",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
        reservations:
          cpus: "0.5"
          memory: 1G
    networks:
      - minsik-internal
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ============================================================================
  # PostgreSQL - Production Configuration
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: minsik-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # Production-optimized settings
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    # NO EXPOSED PORTS - internal network only (security)
    volumes:
      # Persistent data storage
      - postgres_data:/var/lib/postgresql/data
      # Initialize database schemas on first run
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      # Optional: Custom PostgreSQL configuration
      # - ./config/postgresql.conf:/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=64MB
      -c maintenance_work_mem=64MB
      -c effective_cache_size=768MB
      -c wal_buffers=16MB
      -c max_connections=50
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
      -c dynamic_shared_memory_type=posix
    shm_size: "512m"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
        reservations:
          cpus: "0.25"
          memory: 512M
    networks:
      - minsik-internal
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    # Security: Run as non-root user (PostgreSQL does this by default)
    user: postgres

  # ============================================================================
  # Redis - Production Configuration
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: minsik-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --save 300 10
      --save 900 1
      --appendonly yes
      --appendfsync everysec
      --tcp-backlog 128
      --timeout 300
      --tcp-keepalive 300
      --maxclients 50
    # NO EXPOSED PORTS - internal network only (security)
    volumes:
      # Persistent data storage (AOF + RDB snapshots)
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M
    networks:
      - minsik-internal
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    # Security: Run as non-root user (Redis does this by default)
    user: redis

  # ============================================================================
  # Gateway Service - Production Configuration
  # ============================================================================
  gateway-service:
    image: container-registry.jtuta.cloud/minsik/gateway-service:latest
    container_name: minsik-gateway-service
    environment:
      ENV: production
      DEBUG: false
      LOG_LEVEL: ${LOG_LEVEL}
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_HTTP_PORT: ${GATEWAY_HTTP_PORT}
      GATEWAY_WORKERS: ${GATEWAY_WORKERS}
      INGESTION_SERVICE_HOST: ${INGESTION_SERVICE_HOST:-ingestion-service}
      INGESTION_GRPC_PORT: ${INGESTION_GRPC_PORT:-50054}
      BOOKS_SERVICE_HOST: ${BOOKS_SERVICE_HOST:-books-service}
      BOOKS_GRPC_PORT: ${BOOKS_GRPC_PORT:-50055}
      AUTH_SERVICE_HOST: ${AUTH_SERVICE_HOST:-auth-service}
      AUTH_GRPC_PORT: ${AUTH_GRPC_PORT:-50051}
      USER_DATA_SERVICE_HOST: ${USER_DATA_SERVICE_HOST:-user-data-service}
      USER_DATA_GRPC_PORT: ${USER_DATA_GRPC_PORT:-50053}
      RECOMMENDATION_SERVICE_HOST: ${RECOMMENDATION_SERVICE_HOST:-recommendation-service}
      RECOMMENDATION_GRPC_PORT: ${RECOMMENDATION_GRPC_PORT:-50056}
      GRPC_KEEPALIVE_TIME_MS: ${GRPC_KEEPALIVE_TIME_MS:-300000}
      GRPC_KEEPALIVE_TIMEOUT_MS: ${GRPC_KEEPALIVE_TIMEOUT_MS:-10000}
      GRPC_TIMEOUT: ${GRPC_TIMEOUT:-10.0}
      GRPC_RECOMMENDATION_TIMEOUT: ${GRPC_RECOMMENDATION_TIMEOUT:-30.0}
      GRPC_ADMIN_TIMEOUT: ${GRPC_ADMIN_TIMEOUT:-60.0}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://minsik.app,https://www.minsik.app}
      CORS_ALLOW_CREDENTIALS: "true"
      CORS_ALLOW_METHODS: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
      CORS_ALLOW_HEADERS: "Content-Type,Authorization,X-CSRF-Token"
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE}
      RATE_LIMIT_ADMIN_PER_MINUTE: ${RATE_LIMIT_ADMIN_PER_MINUTE}
      RATE_LIMIT_SUGGEST_PER_MINUTE: ${RATE_LIMIT_SUGGEST_PER_MINUTE}
      RATE_LIMIT_STORAGE_URI: redis://:${REDIS_PASSWORD}@redis:6379/1
      RECOMMENDATION_RECOMPUTE_ON_USER_WRITE: ${RECOMMENDATION_RECOMPUTE_ON_USER_WRITE:-true}
      LEDGER_API_KEY: ${LEDGER_API_KEY}
    ports:
      - "127.0.0.1:${GATEWAY_HTTP_PORT}:8040"
    depends_on:
      redis:
        condition: service_healthy
      ingestion-service:
        condition: service_started
      books-service:
        condition: service_started
      auth-service:
        condition: service_started
      user-data-service:
        condition: service_started
      recommendation-service:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - minsik-internal
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ============================================================================
  # Ingestion Service - Production Configuration
  # ============================================================================
  ingestion-service:
    image: container-registry.jtuta.cloud/minsik/ingestion-service:latest
    container_name: minsik-ingestion-service
    stop_grace_period: 30s
    environment:
      ENV: production
      DEBUG: false
      LOG_LEVEL: ${LOG_LEVEL}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_SIZE: ${INGESTION_DB_POOL_SIZE:-3}
      DB_MAX_OVERFLOW: ${INGESTION_DB_MAX_OVERFLOW:-5}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_MAX_CONNECTIONS: ${INGESTION_REDIS_MAX_CONNECTIONS:-10}
      INGESTION_SERVICE_HOST: 0.0.0.0
      INGESTION_GRPC_PORT: ${INGESTION_GRPC_PORT:-50054}
      OPEN_LIBRARY_API_URL: ${OPEN_LIBRARY_API_URL:-https://openlibrary.org}
      OPEN_LIBRARY_RATE_LIMIT: ${OPEN_LIBRARY_RATE_LIMIT:-50}
      GOOGLE_BOOKS_API_URL: ${GOOGLE_BOOKS_API_URL:-https://www.googleapis.com/books/v1}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-30.0}
      INGESTION_BATCH_SIZE: ${INGESTION_BATCH_SIZE:-50}
      INGESTION_MAX_RETRIES: ${INGESTION_MAX_RETRIES:-3}
      INGESTION_RETRY_DELAY: ${INGESTION_RETRY_DELAY:-5}
      CONTINUOUS_FETCH_ENABLED: ${CONTINUOUS_FETCH_ENABLED:-true}
      CONTINUOUS_OL_CRON: ${CONTINUOUS_OL_CRON:-0 * * * *}
      CONTINUOUS_OL_BOOKS_PER_RUN: ${CONTINUOUS_OL_BOOKS_PER_RUN:-100}
      CONTINUOUS_GB_CRON: ${CONTINUOUS_GB_CRON:-0 4,10,16,22 * * *}
      CONTINUOUS_GB_BOOKS_PER_RUN: ${CONTINUOUS_GB_BOOKS_PER_RUN:-40}
      DESCRIPTION_ENRICH_ENABLED: ${DESCRIPTION_ENRICH_ENABLED:-true}
      DESCRIPTION_ENRICH_CRON: ${DESCRIPTION_ENRICH_CRON:-30 */2 * * *}
      DESCRIPTION_ENRICH_BATCH_SIZE: ${DESCRIPTION_ENRICH_BATCH_SIZE:-5}
      DESCRIPTION_MIN_LENGTH: ${DESCRIPTION_MIN_LENGTH:-100}
      OL_DUMP_BASE_URL: ${OL_DUMP_BASE_URL:-https://openlibrary.org/data}
      DUMP_BATCH_SIZE: ${DUMP_BATCH_SIZE:-500}
      DUMP_TMP_DIR: ${DUMP_TMP_DIR:-/tmp}
      DUMP_COMMIT_INTERVAL: ${DUMP_COMMIT_INTERVAL:-5000}
      DUMP_EDITION_BATCH_SIZE: ${DUMP_EDITION_BATCH_SIZE:-500}
      DUMP_EDITIONS_ENABLED: ${DUMP_EDITIONS_ENABLED:-true}
      DUMP_RATINGS_ENABLED: ${DUMP_RATINGS_ENABLED:-true}
      DUMP_READING_LOG_ENABLED: ${DUMP_READING_LOG_ENABLED:-true}
      DUMP_WIKIDATA_ENABLED: ${DUMP_WIKIDATA_ENABLED:-true}
      DUMP_EDITION_FLUSH_INTERVAL: ${DUMP_EDITION_FLUSH_INTERVAL:-100000}
      DUMP_WORK_MIN_QUALITY_SCORE: ${DUMP_WORK_MIN_QUALITY_SCORE:-2}
      DUMP_AUTHOR_MIN_QUALITY_SCORE: ${DUMP_AUTHOR_MIN_QUALITY_SCORE:-2}
      CLEANUP_ENABLED: ${CLEANUP_ENABLED:-true}
      CLEANUP_CRON: ${CLEANUP_CRON:-0 3,15 * * *}
      CLEANUP_BOOK_MIN_QUALITY_SCORE: ${CLEANUP_BOOK_MIN_QUALITY_SCORE:-7}
      CLEANUP_AUTHOR_MIN_BOOKS: ${CLEANUP_AUTHOR_MIN_BOOKS:-5}
      CLEANUP_BOOK_BATCH_SIZE: ${CLEANUP_BOOK_BATCH_SIZE:-100}
      CLEANUP_AUTHOR_BATCH_SIZE: ${CLEANUP_AUTHOR_BATCH_SIZE:-50}
      CLEANUP_SERIES_BATCH_SIZE: ${CLEANUP_SERIES_BATCH_SIZE:-500}
      CLEANUP_GENRE_BATCH_SIZE: ${CLEANUP_GENRE_BATCH_SIZE:-1000}
      CLEANUP_AUTHOR_MAX_BOOKS: ${CLEANUP_AUTHOR_MAX_BOOKS:-500}
      CLEANUP_SERIES_MIN_BOOKS: ${CLEANUP_SERIES_MIN_BOOKS:-3}
      CLEANUP_SERIES_MAX_BOOKS: ${CLEANUP_SERIES_MAX_BOOKS:-30}
      GENRE_BUBBLE_ENABLED: ${GENRE_BUBBLE_ENABLED:-true}
      GENRE_BUBBLE_CRON: ${GENRE_BUBBLE_CRON:-0 6 * * 0}
      GENRE_BUBBLE_MIN_PAIR_COUNT: ${GENRE_BUBBLE_MIN_PAIR_COUNT:-5}
      LEDGER_API_KEY: ${LEDGER_API_KEY}
    # NO EXPOSED PORTS - internal network only (security)
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.15"
          memory: 192M
    networks:
      - minsik-internal
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ============================================================================
  # Books Service - Production Configuration
  # ============================================================================
  books-service:
    image: container-registry.jtuta.cloud/minsik/books-service:latest
    container_name: minsik-books-service
    environment:
      ENV: production
      DEBUG: false
      LOG_LEVEL: ${LOG_LEVEL}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_SIZE: ${BOOKS_DB_POOL_SIZE:-3}
      DB_MAX_OVERFLOW: ${BOOKS_DB_MAX_OVERFLOW:-5}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_MAX_CONNECTIONS: ${BOOKS_REDIS_MAX_CONNECTIONS:-10}
      BOOKS_SERVICE_HOST: 0.0.0.0
      BOOKS_GRPC_PORT: ${BOOKS_GRPC_PORT:-50055}
      CACHE_BOOK_DETAIL_TTL: ${CACHE_BOOK_DETAIL_TTL:-3600}
      CACHE_AUTHOR_DETAIL_TTL: ${CACHE_AUTHOR_DETAIL_TTL:-3600}
      CACHE_AUTHOR_BOOKS_TTL: ${CACHE_AUTHOR_BOOKS_TTL:-1800}
      CACHE_SEARCH_TTL: ${CACHE_SEARCH_TTL:-900}
      CACHE_POPULAR_TTL: ${CACHE_POPULAR_TTL:-21600}
      CACHE_CATEGORY_TOP_BOOKS_TTL: ${CACHE_CATEGORY_TOP_BOOKS_TTL:-93600}
      CACHE_GENRE_BUBBLE_TTL: ${CACHE_GENRE_BUBBLE_TTL:-21600}
      CATEGORY_CACHE_REFRESH_ENABLED: ${CATEGORY_CACHE_REFRESH_ENABLED:-true}
      CATEGORY_CACHE_REFRESH_CRON: ${CATEGORY_CACHE_REFRESH_CRON:-0 0 * * *}
      VIEW_COUNT_FLUSH_ENABLED: ${VIEW_COUNT_FLUSH_ENABLED:-true}
      VIEW_COUNT_FLUSH_CRON: ${VIEW_COUNT_FLUSH_CRON:-*/5 * * * *}
      VIEW_COUNT_FLUSH_BATCH_SIZE: ${VIEW_COUNT_FLUSH_BATCH_SIZE:-100}
      SEARCH_DEFAULT_LIMIT: ${SEARCH_DEFAULT_LIMIT:-10}
      SEARCH_MAX_LIMIT: ${SEARCH_MAX_LIMIT:-100}
      SEARCH_AUTHOR_BOOKS_EXPANSION: ${SEARCH_AUTHOR_BOOKS_EXPANSION:-3}
      ES_HOST: ${ES_HOST:-elasticsearch}
      ES_PORT: ${ES_PORT:-9200}
      ES_INDEX_BOOKS: ${ES_INDEX_BOOKS:-books}
      ES_INDEX_AUTHORS: ${ES_INDEX_AUTHORS:-authors}
      ES_INDEX_SERIES: ${ES_INDEX_SERIES:-series}
      ES_REINDEX_ENABLED: ${ES_REINDEX_ENABLED:-true}
      ES_REINDEX_CRON: ${ES_REINDEX_CRON:-0 */6 * * *}
      ES_REINDEX_BATCH_SIZE: ${ES_REINDEX_BATCH_SIZE:-1000}
    # NO EXPOSED PORTS - internal network only (security)
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - minsik-internal
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ============================================================================
  # Auth Service - Production Configuration
  # ============================================================================
  auth-service:
    image: container-registry.jtuta.cloud/minsik/auth-service:latest
    container_name: minsik-auth-service
    environment:
      ENV: production
      DEBUG: false
      LOG_LEVEL: ${LOG_LEVEL}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_SIZE: ${AUTH_DB_POOL_SIZE:-3}
      DB_MAX_OVERFLOW: ${AUTH_DB_MAX_OVERFLOW:-5}
      AUTH_SERVICE_HOST: 0.0.0.0
      AUTH_GRPC_PORT: ${AUTH_GRPC_PORT:-50051}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-30}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      MAX_FAILED_LOGIN_ATTEMPTS: ${MAX_FAILED_LOGIN_ATTEMPTS:-5}
      LOCKOUT_DURATION_MINUTES: ${LOCKOUT_DURATION_MINUTES:-30}
    # NO EXPOSED PORTS - internal network only (security)
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M
    networks:
      - minsik-internal
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ============================================================================
  # User Data Service - Production Configuration
  # ============================================================================
  user-data-service:
    image: container-registry.jtuta.cloud/minsik/user-data-service:latest
    container_name: minsik-user-data-service
    environment:
      ENV: production
      DEBUG: false
      LOG_LEVEL: ${LOG_LEVEL}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_SIZE: ${USER_DATA_DB_POOL_SIZE:-3}
      DB_MAX_OVERFLOW: ${USER_DATA_DB_MAX_OVERFLOW:-5}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_MAX_CONNECTIONS: ${USER_DATA_REDIS_MAX_CONNECTIONS:-5}
      USER_DATA_SERVICE_HOST: 0.0.0.0
      USER_DATA_GRPC_PORT: ${USER_DATA_GRPC_PORT:-50053}
    # NO EXPOSED PORTS - internal network only (security)
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M
    networks:
      - minsik-internal
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ============================================================================
  # Recommendation Service - Production Configuration
  # ============================================================================
  recommendation-service:
    image: container-registry.jtuta.cloud/minsik/recommendation-service:latest
    container_name: minsik-recommendation-service
    environment:
      ENV: production
      DEBUG: false
      LOG_LEVEL: ${LOG_LEVEL}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_SIZE: ${DB_POOL_SIZE}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW}
      RECOMMENDATION_DB_POOL_SIZE: ${RECOMMENDATION_DB_POOL_SIZE:-10}
      RECOMMENDATION_DB_MAX_OVERFLOW: ${RECOMMENDATION_DB_MAX_OVERFLOW:-20}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-20}
      RECOMMENDATION_SERVICE_HOST: 0.0.0.0
      RECOMMENDATION_GRPC_PORT: ${RECOMMENDATION_GRPC_PORT:-50056}
      LIST_DEFAULT_SIZE: ${LIST_DEFAULT_SIZE:-50}
      CACHE_RECOMMENDATION_TTL: ${CACHE_RECOMMENDATION_TTL:-86400}
      CACHE_CONTEXTUAL_TTL: ${CACHE_CONTEXTUAL_TTL:-21600}
      CACHE_PROFILE_TTL: ${CACHE_PROFILE_TTL:-86400}
      CACHE_PERSONAL_TTL: ${CACHE_PERSONAL_TTL:-86400}
      CACHE_PERSONAL_CONTEXTUAL_TTL: ${CACHE_PERSONAL_CONTEXTUAL_TTL:-1800}
      PERSONAL_COLD_START_THRESHOLD: ${PERSONAL_COLD_START_THRESHOLD:-5}
      HOME_BOOK_CATEGORIES: ${HOME_BOOK_CATEGORIES}
      HOME_AUTHOR_CATEGORIES: ${HOME_AUTHOR_CATEGORIES}
      CACHE_CASE_POOL_TTL: ${CACHE_CASE_POOL_TTL:-7200}
      GENERAL_REFRESH_ENABLED: ${GENERAL_REFRESH_ENABLED:-true}
      GENERAL_REFRESH_CRON: ${GENERAL_REFRESH_CRON:-0 0 * * *}
      PERSONAL_REFRESH_ENABLED: ${PERSONAL_REFRESH_ENABLED:-true}
      PERSONAL_REFRESH_CRON: ${PERSONAL_REFRESH_CRON:-0 1 * * *}
      CONTEXTUAL_PRECOMPUTE_ENABLED: ${CONTEXTUAL_PRECOMPUTE_ENABLED:-true}
      CONTEXTUAL_PRECOMPUTE_CRON: ${CONTEXTUAL_PRECOMPUTE_CRON:-0 2 * * *}
      CASE_POOL_REFRESH_ENABLED: ${CASE_POOL_REFRESH_ENABLED:-true}
      CASE_POOL_REFRESH_CRON: ${CASE_POOL_REFRESH_CRON:-30 * * * *}
      BOOK_OF_WEEK_ENABLED: ${BOOK_OF_WEEK_ENABLED:-true}
      BOOK_OF_WEEK_CRON: ${BOOK_OF_WEEK_CRON:-30 3 * * 1}
      CONTEXTUAL_PRECOMPUTE_MIN_RATINGS: ${CONTEXTUAL_PRECOMPUTE_MIN_RATINGS:-500}
      CONTEXTUAL_COLD_TTL: ${CONTEXTUAL_COLD_TTL:-1800}
      AVAILABLE_LANGUAGES: ${AVAILABLE_LANGUAGES}
    # NO EXPOSED PORTS - internal network only (security)
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M
    networks:
      - minsik-internal
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ============================================================================
  # RQ Worker - Production Configuration
  # ============================================================================
  rq-worker:
    image: container-registry.jtuta.cloud/minsik/rq-worker:latest
    container_name: minsik-rq-worker
    command: rq worker ingestion --url redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/${REDIS_DB:-0}
    environment:
      ENV: production
      DEBUG: false
      LOG_LEVEL: ${LOG_LEVEL}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_SIZE: ${INGESTION_DB_POOL_SIZE:-3}
      DB_MAX_OVERFLOW: ${INGESTION_DB_MAX_OVERFLOW:-5}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_MAX_CONNECTIONS: ${INGESTION_REDIS_MAX_CONNECTIONS:-10}
      OPEN_LIBRARY_API_URL: ${OPEN_LIBRARY_API_URL:-https://openlibrary.org}
      OPEN_LIBRARY_RATE_LIMIT: ${OPEN_LIBRARY_RATE_LIMIT:-50}
      GOOGLE_BOOKS_API_URL: ${GOOGLE_BOOKS_API_URL:-https://www.googleapis.com/books/v1}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-30.0}
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    networks:
      - minsik-internal
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ============================================================================
  # DB Migrator - Production (runs all migrations before services start)
  # ============================================================================
  db-migrator:
    image: container-registry.jtuta.cloud/minsik/db-migrator:latest
    container_name: minsik-db-migrator
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - minsik-internal
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

# ============================================================================
# Volumes - Production (persistent, backed up)
# ============================================================================
volumes:
  postgres_data:
    name: minsik-postgres-data
    driver: local

  redis_data:
    name: minsik-redis-data
    driver: local

  es_data:
    name: minsik-es-data
    driver: local

# ============================================================================
# Networks - Production (isolated internal network)
# ============================================================================
networks:
  minsik-frontend:
    driver: bridge

  minsik-internal:
    driver: bridge
    name: minsik-prod-network
    internal: false
    ipam:
      driver: default
      config:
        - subnet: 172.32.0.0/16
